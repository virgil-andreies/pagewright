# Checks every push to main: types, unit tests, the production build and its size, and the real-browser tests.
# When all pass, publishes exactly that build to Cloudflare and checks the live site.
# GitHub e-mails the person who pushed when a run fails.
name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push makes the older, still-running check pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      # The pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build the web app
        run: pnpm --filter @pagewright/web build

      - name: Check the bundle size
        run: pnpm --filter @pagewright/web check-bundle

      - name: Make the sample PDF the browser tests open
        run: pnpm sample

      # Uses the Chrome preinstalled on the runner, and the build from above.
      - name: Real-browser tests
        run: pnpm e2e
        env:
          CHROME_PATH: /usr/bin/google-chrome
          E2E_SKIP_BUILD: '1'

      # The build that passed every check is the one that gets published.
      - name: Hand the tested build to the publish job
        uses: actions/upload-artifact@v7
        with:
          name: web-build
          path: apps/web/dist
          retention-days: 1
          if-no-files-found: error

      - name: Keep the screenshots of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-screenshots
          path: out/e2e
          retention-days: 7
          if-no-files-found: ignore

  publish:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      # For Wrangler (the publishing tool) and the live check, at the versions in the lockfile.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Get the tested build
        uses: actions/download-artifact@v8
        with:
          name: web-build
          path: apps/web/dist

      - name: Publish to Cloudflare
        id: deploy
        working-directory: apps/web
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          pnpm exec wrangler deploy | tee "$RUNNER_TEMP/deploy.log"
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/deploy.log" | head -n 1)
          if [ -z "$url" ]; then echo "::error title=Publish::Wrangler did not report the site's address"; exit 1; fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Check the live site
        run: pnpm --filter @pagewright/web check-live "${{ steps.deploy.outputs.url }}"
