<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pagewright PDF — edit, sign and merge PDFs in your browser</title>
    <meta name="description" content="Pagewright PDF: a free PDF editor in your browser. Highlight, comment, draw, add text, stamps and signatures, merge, reorder, rotate and delete pages. Your files never leave your device." />
    <meta name="application-name" content="Pagewright PDF" />
    <meta name="apple-mobile-web-app-title" content="Pagewright PDF" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1d2025" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="max-width: 440px; margin: 15vh auto 0; padding: 0 16px; font: 15px/1.5 system-ui, sans-serif; text-align: center">
        <h1 style="font-size: 22px; margin: 0 0 8px">Pagewright PDF needs JavaScript</h1>
        <p style="margin: 0">It runs entirely in your browser, so your files never leave your device. Please turn JavaScript on for this site.</p>
      </div>
    </noscript>
    <!-- Before the app: shows a message instead of a blank page in browsers too old to run it. -->
    <script src="/browser-check.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
