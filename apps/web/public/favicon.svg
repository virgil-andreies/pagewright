<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>Pagewright PDF</title>
  <!-- Blue tile, the app's accent colour -->
  <rect width="64" height="64" rx="14" fill="#2563eb"/>
  <!-- A page with a folded corner -->
  <path d="M17 9h21l11 11v33a3 3 0 0 1-3 3H17a3 3 0 0 1-3-3V12a3 3 0 0 1 3-3z" fill="#ffffff"/>
  <path d="M38 9v8a3 3 0 0 0 3 3h8z" fill="#bfd3fb"/>
  <!-- Lines of text -->
  <rect x="20" y="22" width="15" height="3" rx="1.5" fill="#c7d2e3"/>
  <rect x="20" y="29" width="22" height="3" rx="1.5" fill="#c7d2e3"/>
  <!-- A pen writing on the page -->
  <path d="M51.5 23.5l4 4L37 46l-5.5 1.5L33 42z" fill="#1e3a8a"/>
  <path d="M51.5 23.5l1.8-1.8a2 2 0 0 1 2.8 0l1.2 1.2a2 2 0 0 1 0 2.8l-1.8 1.8z" fill="#f59e0b"/>
  <!-- The PDF badge -->
  <rect x="6" y="38" width="31" height="16" rx="4" fill="#dc2626"/>
  <text x="21.5" y="50.2" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" fill="#ffffff" letter-spacing="0.3">PDF</text>
</svg>
